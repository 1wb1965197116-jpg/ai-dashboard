<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Dashboard</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<style>
body { margin:0; font-family:Arial; background:#0f0f0f; color:#fff; }
header { padding:15px; text-align:center; background:#1a1a1a; }
nav { display:flex; justify-content:space-around; background:#222; padding:10px; }
button { flex:1; padding:10px; margin:2px; background:#333; color:#fff; border:none; }
section { display:none; padding:15px; }
.active { display:block; }
input { width:100%; padding:10px; margin-bottom:10px; background:#222; color:#fff; border:1px solid #444; }
table { width:100%; border-collapse:collapse; }
th, td { border:1px solid #444; padding:8px; }
th { background:#222; }
video,img { width:100%; margin-top:10px; }
#qrContainer canvas { margin-top:10px; }
</style>
</head>
<body>

<header>AI Control Dashboard</header>

<div id="auth">
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
</div>

<nav>
<button onclick="showTab('translations')">Translations</button>
<button onclick="showTab('ocr')">OCR</button>
<button onclick="showTab('video')">Video</button>
<button onclick="showTab('devices')">Devices</button>
<button onclick="showTab('qr')">QR Device Sync</button>
</nav>

<!-- TRANSLATIONS -->
<section id="translations" class="active">
<h2>Translations</h2>
<input id="search" placeholder="Search translations...">
<table>
<thead><tr><th>Original</th><th>Translated</th><th>Source</th><th>Time</th></tr></thead>
<tbody id="translationTable"></tbody>
</table>
</section>

<!-- OCR -->
<section id="ocr">
<h2>OCR Upload</h2>
<input type="file" id="ocrUpload">
<button onclick="uploadOCR()">Upload</button>
<img id="preview">
<table>
<thead><tr><th>Text</th><th>Source</th><th>Time</th></tr></thead>
<tbody id="ocrTable"></tbody>
</table>
</section>

<!-- VIDEO -->
<section id="video">
<h2>Video Player</h2>
<input id="videoUrl" placeholder="Paste video URL">
<button onclick="loadVideo()">Load</button>
<video id="player" controls></video>
</section>

<!-- DEVICES -->
<section id="devices">
<h2>Devices</h2>
<table>
<thead><tr><th>Name</th><th>Created</th></tr></thead>
<tbody id="deviceTable"></tbody>
</table>
</section>

<!-- QR DEVICE SYNC -->
<section id="qr">
<h2>Device QR Sync</h2>
<input id="deviceName" placeholder="Enter device name">
<button onclick="createDevice()">Create Device + QR</button>
<div id="qrContainer"></div>
</section>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
import QRCode from "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm";

/* ---------------- Supabase Setup ---------------- */
const SUPABASE_URL = "https://vhcyulwlgekypzdbtnok.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------------- Auth ---------------- */
window.login = async () => {
    const email=document.getElementById("email").value;
    const password=document.getElementById("password").value;
    const { error } = await supabase.auth.signInWithPassword({email,password});
    if(error) alert(error.message); else alert("Logged in");
};
window.logout = async () => { await supabase.auth.signOut(); alert("Logged out"); };

/* ---------------- Navigation ---------------- */
window.showTab = (id) => { document.querySelectorAll("section").forEach(s=>s.classList.remove("active")); document.getElementById(id).classList.add("active"); };

/* ---------------- Load / Render Tables ---------------- */
async function loadTranslations() { const { data } = await supabase.from("translations").select("*"); renderTable(data,"translationTable",["original","translated","source","created_at"]); }
async function loadOCR() { const { data } = await supabase.from("ocr_logs").select("*"); renderTable(data,"ocrTable",["text","source","created_at"]); }
async function loadDevices() { const { data } = await supabase.from("devices").select("*"); renderTable(data,"deviceTable",["device_name","created_at"]); }
function renderTable(data,targetId,keys){const tbody=document.getElementById(targetId);tbody.innerHTML="";data.forEach(r=>{const tr=document.createElement("tr");tr.innerHTML=keys.map(k=>`<td>${r[k]||""}</td>`).join("");tbody.appendChild(tr);});}

/* ---------------- Search ---------------- */
document.getElementById("search").addEventListener("input", async e => {
    const q=e.target.value.toLowerCase();
    const { data }=await supabase.from("translations").select("*");
    const filtered=data.filter(r=>(r.original||"").toLowerCase().includes(q)||(r.translated||"").toLowerCase().includes(q));
    renderTable(filtered,"translationTable",["original","translated","source","created_at"]);
});

/* ---------------- Video ---------------- */
window.loadVideo = () => { document.getElementById("player").src=document.getElementById("videoUrl").value; };

/* ---------------- OCR Upload Preview ---------------- */
window.uploadOCR = () => {
    const file=document.getElementById("ocrUpload").files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>document.getElementById("preview").src=reader.result;
    reader.readAsDataURL(file);
};

/* ---------------- QR Device Sync ---------------- */
window.createDevice = async () => {
    const name=document.getElementById("deviceName").value;
    const { data,error } = await supabase.from("devices").insert([{device_name:name}]).select().single();
    if(error){ alert(error.message); return; }
    const deviceId=data.id;
    const qrData=JSON.stringify({supabase_url:SUPABASE_URL,device_id:deviceId});
    const qrContainer=document.getElementById("qrContainer");
    qrContainer.innerHTML="";
    const canvas=document.createElement("canvas");
    qrContainer.appendChild(canvas);
    QRCode.toCanvas(canvas, qrData, e=>{if(e) console.error(e);});
};

/* ---------------- Realtime Updates ---------------- */
supabase
  .channel('translations')
  .on('postgres_changes', { event:'*', schema:'public', table:'translations' }, payload => {
      console.log('Change received:', payload);
      loadTranslations();
  })
  .subscribe();

/* ---------------- Initial Load ---------------- */
loadTranslations();
loadOCR();
loadDevices();
setInterval(()=>{ loadTranslations(); loadOCR(); loadDevices(); },5000);

/* ---------------- Tampermonkey Hook ---------------- */
window.autoTranslateAndSend = function(text, translatedText=null){
    const translated=translatedText||text;
    let deviceConfig=JSON.parse(localStorage.getItem("deviceConfig")||"{}");
    fetch(`${SUPABASE_URL}/rest/v1/translations`, {
        method:"POST",
        headers:{ "Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY },
        body: JSON.stringify({ original:text, translated, source:window.location.href, device_id:deviceConfig.device_id||null })
    });
};

</script>
</body>
</html>
