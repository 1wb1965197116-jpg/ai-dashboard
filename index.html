<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Control Center</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: #fff;
}

header {
    padding: 15px;
    text-align: center;
    background: #1a1a1a;
}

#auth {
    padding: 20px;
    text-align: center;
}

input, button {
    padding: 10px;
    margin: 5px;
    background: #222;
    color: #fff;
    border: 1px solid #444;
}

nav {
    display: flex;
    justify-content: space-around;
    background: #222;
}

nav button {
    flex: 1;
}

section {
    display: none;
    padding: 15px;
}

.active {
    display: block;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #444;
    padding: 8px;
}

th {
    background: #222;
}

img {
    max-width: 100%;
}
</style>
</head>

<body>

<header>AI Control Center</header>

<div id="auth">
    <input id="email" placeholder="Email"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>
</div>

<nav>
<button onclick="showTab('translations')">Translations</button>
<button onclick="showTab('ocr')">OCR</button>
<button onclick="showTab('video')">Video</button>
<button onclick="showTab('devices')">Devices</button>
</nav>

<section id="translations" class="active">
<h2>Translations</h2>
<table>
<thead><tr><th>Original</th><th>Translated</th><th>Source</th></tr></thead>
<tbody id="translationTable"></tbody>
</table>
</section>

<section id="ocr">
<h2>OCR Upload</h2>
<input type="file" id="ocrUpload">
<button onclick="uploadOCR()">Upload</button>
<img id="preview">
<table>
<thead><tr><th>Text</th><th>Source</th></tr></thead>
<tbody id="ocrTable"></tbody>
</table>
</section>

<section id="video">
<h2>Video Player</h2>
<input id="videoUrl" placeholder="Video URL">
<button onclick="loadVideo()">Load</button>
<video id="player" controls></video>
</section>

<section id="devices">
<h2>Devices</h2>
<table>
<thead><tr><th>Name</th><th>Created</th></tr></thead>
<tbody id="deviceTable"></tbody>
</table>
</section>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://vhcyulwlgekypzdbtnok.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* AUTH */
async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({
        email,
        password
    });

    if (error) alert(error.message);
    else alert("Logged in");
}

async function logout() {
    await supabase.auth.signOut();
    alert("Logged out");
}

/* NAV */
window.showTab = (id) => {
    document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
};

/* LOAD TABLES */
async function loadTranslations() {
    const { data } = await supabase.from("translations").select("*");
    render(data, "translationTable");
}

async function loadOCR() {
    const { data } = await supabase.from("ocr_logs").select("*");
    renderOCR(data);
}

async function loadDevices() {
    const { data } = await supabase.from("devices").select("*");
    const tbody = document.getElementById("deviceTable");
    tbody.innerHTML = "";

    data.forEach(d => {
        tbody.innerHTML += `<tr><td>${d.device_name}</td><td>${d.created_at}</td></tr>`;
    });
}

/* RENDER */
function render(data, id) {
    const tbody = document.getElementById(id);
    tbody.innerHTML = "";

    data.forEach(r => {
        tbody.innerHTML += `
        <tr>
            <td>${r.original}</td>
            <td>${r.translated}</td>
            <td>${r.source}</td>
        </tr>`;
    });
}

function renderOCR(data) {
    const tbody = document.getElementById("ocrTable");
    tbody.innerHTML = "";

    data.forEach(r => {
        tbody.innerHTML += `
        <tr>
            <td>${r.text}</td>
            <td>${r.source}</td>
        </tr>`;
    });
}

/* OCR UPLOAD */
window.uploadOCR = async () => {
    const file = document.getElementById("ocrUpload").files[0];
    const reader = new FileReader();

    reader.onload = () => {
        document.getElementById("preview").src = reader.result;
    };

    reader.readAsDataURL(file);
};

/* VIDEO */
window.loadVideo = () => {
    const url = document.getElementById("videoUrl").value;
    document.getElementById("player").src = url;
};

/* REALTIME REFRESH */
setInterval(() => {
    loadTranslations();
    loadOCR();
    loadDevices();
}, 5000);

</script>

</body>
</html>
